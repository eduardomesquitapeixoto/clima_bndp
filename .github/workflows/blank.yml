# .github/workflows/atualizar_dados.yml
name: Atualizar dados meteorológicos (proxy via R)

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # essencial para fazer push

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: false  # necessário para usar token personalizado

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev curl jq

      - name: Instalar pacotes R
        run: |
          Rscript -e "install.packages('pacman', repos = 'https://cloud.r-project.org')"
          Rscript -e "pacman::p_load(httr, tidyverse, jsonlite, vroom, usethis, logger, curl, rlang, purrr, dplyr, tidyr, readr, tibble)"

      - name: Executar script R (com dados brutos)
        env:
          BNDMET_API_KEY: ${{ secrets.BNDMET_API_KEY || '1hS5CJHPSCOCSh4W5b57aZHqBBjmSuDy' }}
          TZ: America/Sao_Paulo
        run: |
          cat << 'EOF' > script.R
          pacman::p_load(httr, tidyverse, jsonlite, vroom, usethis, logger, curl)

          # --- Função para baixar lista de proxies de múltiplas fontes ---
          get_proxy_list <- function() {
            sources <- c(
              "https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&country=BR&timeout=5000",
              "https://www.proxy-list.download/api/v1/get?type=http&country=BR",
              "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt",
              "https://raw.githubusercontent.com/ShiftyTR/Proxy-List/master/http.txt"
            )
            proxies <- character()
            for (url in sources) {
              message("Baixando lista de ", url)
              tryCatch({
                resp <- curl::curl_fetch_memory(url, handle = curl::new_handle(connecttimeout = 10))
                if (resp$status_code == 200) {
                  text <- rawToChar(resp$content)
                  matches <- gregexpr("([0-9]{1,3}\\.){3}[0-9]{1,3}:[0-9]+", text)
                  ips <- regmatches(text, matches)[[1]]
                  proxies <- c(proxies, ips)
                }
              }, error = function(e) message("Erro ao baixar ", url, ": ", e$message))
            }
            unique(proxies)
          }

          # --- Função para testar um proxy com a API BNDMET (timeout 10s) ---
          test_proxy <- function(proxy, api_key, timeout = 10) {
            test_url <- "https://api-bndmet.decea.mil.br/v1/estacoes/A628/fenomenos/I101?dataInicio=2026-08-01&dataFinal=2026-08-15"
            h <- curl::new_handle()
            curl::handle_setheaders(h,
              "accept" = "application/json",
              "x-api-key" = api_key,
              "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
            )
            curl::handle_setopt(h, connecttimeout = timeout, timeout = timeout,
                                proxy = proxy, proxytype = 0)
            tryCatch({
              resp <- curl::curl_fetch_memory(test_url, handle = h)
              if (resp$status_code == 200) {
                return(TRUE)
              } else {
                return(FALSE)
              }
            }, error = function(e) {
              return(FALSE)
            })
          }

          # --- Busca um proxy funcional (limite de 100 testes) ---
          find_working_proxy <- function(api_key) {
            proxies <- get_proxy_list()
            if (length(proxies) == 0) {
              message("Nenhum proxy encontrado nas listas.")
              return(NULL)
            }
            message("Testando até 100 proxies de um total de ", length(proxies), "...")
            proxies_to_test <- head(proxies, 100)
            for (proxy in proxies_to_test) {
              message("Testando proxy: ", proxy)
              if (test_proxy(proxy, api_key, timeout = 10)) {
                message("Proxy válido: ", proxy)
                return(proxy)
              }
            }
            return(NULL)
          }

          # --- Configuração inicial ---
          apikey <- Sys.getenv("BNDMET_API_KEY", "1hS5CJHPSCOCSh4W5b57aZHqBBjmSuDy")
          scraper_key <- Sys.getenv("SCRAPERAPI_KEY")
          proxy <- NULL

          if (nzchar(scraper_key)) {
            message("Usando ScraperAPI (configurado via secret).")
          } else {
            message("Buscando proxy público...")
            proxy <- find_working_proxy(apikey)
            if (!is.null(proxy)) {
              message("Proxy selecionado: ", proxy)
              Sys.setenv(http_proxy = paste0("http://", proxy))
              Sys.setenv(https_proxy = paste0("http://", proxy))
            } else {
              message("Nenhum proxy funcional. Tentando conexão direta (pode falhar).")
            }
          }

          # --- CSV embutido (completo) ---
