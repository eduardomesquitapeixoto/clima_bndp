          PATY DO A,Paty do Alferes - Avelar,RJ,Operante,-22.34722221,-43.41777777,508,09/11/2022,A637,662932.574,7527884.072,auto
          RESENDE_0,RESENDE,RJ,Operante,-22.45138888,-44.44499999,438.83,28/09/2006,A609,557105.139,7517103.613,auto
          RIO CLARO,RIO CLARO,RJ,Operante,-22.653579,-44.040916,516,02/06/2016,A626,598540.679,7494510.429,auto
          FORTE DE COPACABANA - RIO DE JANEIRO,RIO DE JANEIRO - FORTE DE COPACABANA,RJ,Operante,-22.98833333,-43.19055555,25.59,17/05/2007,A652,685472.137,7456627.697,auto
          JACAREPAGUA - RIO DE JANEIRO,RIO DE JANEIRO - JACAREPAGUA,RJ,Operante,-22.93999999,-43.40277777,20,09/08/2017,A636,663772.899,7462232.305,auto
          VILA MILITAR - RIO DE JANEIRO,RIO DE JANEIRO - VILA MILITAR,RJ,Operante,-22.86138888,-43.41138888,30.43,12/04/2007,A621,662983.731,7470946.343,auto
          MARAMBAIA - RIO DE JANEIRO,RIO DE JANEIRO-MARAMBAIA,RJ,Operante,-23.05027777,-43.59555555,12,07/11/2002,A602,643886.310,7450223.918,auto
