          CORDEIRO,CORDEIRO,RJ,Operante,-22.02222221,-42.36444444,505.9,15/07/1971,\"83718\",772071.308,7562365.853,conv
          ITAPERUNA,ITAPERUNA,RJ,Operante,-21.20444444,-41.90555555,123.6,31/12/1921,\"83695\",821278.084,7652085.524,conv
          ITATIAIA_,ITATIAIA,RJ,Pane,-22.325541632523834,-44.532508635571475,,,A635,548144.3,7531065,conv
          RESENDE,RESENDE,RJ,Operante,-22.45111111,-44.44472221,439.9,21/05/1944,\"83738\",557133.835,7517134.255,conv
          SANTA MARIA MADALENA_0,SANTA MARIA MADALENA,RJ,Operante,-21.96805554,-42.00305555,640,20/12/1921,\"83696\",809518.707,7567678.708,conv
          SANTO ANTONIO PADUA,SANTO ANTONIO DE PADUA,RJ,Operante,-21.53694444,-42.16083333,95,31/03/1924,\"83805\",794091.565,7615748.955,conv
          TERESOPOLIS_0,TERESOPOLIS,RJ,Operante,-22.41722221,-42.97222221,874.2,31/12/1912,\"83744\",708722.265,7519582.305,conv"

          estacoes <- readr::read_delim(I(estacoes_csv), delim = ",", show_col_types = FALSE) |>
            dplyr::filter(CD_SITUACAO == "Operante", tipo_ == "auto") |>
            rlang::set_names("localidades", "nome_estacao", "nome_estado", "situacao",
                             "latitude","longitude", "altitude", "dt_inicio_operacao",
                             "cod_estacao","x_","y_", "tipo")

          # --- Função que retorna os dados BRUTOS (JSON) sem processamento ---
          pega_dados_brutos <- function(estacao, indicador, data_inicio, data_fim, tentativa = 1) {

            data_inicio <- as.Date(data_inicio) |> format("%Y-%m-%d")
            data_fim    <- as.Date(data_fim) |> format("%Y-%m-%d")

            if (nzchar(scraper_key)) {
              base_url <- "https://api-bndmet.decea.mil.br/v1/estacoes/"
              params <- paste0(estacao, "/fenomenos/", indicador,
                               "?dataInicio=", data_inicio, "&dataFinal=", data_fim)
              final_url <- paste0(
                "https://api.scraperapi.com/?api_key=", scraper_key,
                "&url=", URLencode(paste0(base_url, params))
              )
            } else {
              final_url <- paste0(
                "https://api-bndmet.decea.mil.br/v1/estacoes/",
                estacao, "/fenomenos/", indicador,
                "?dataInicio=", data_inicio, "&dataFinal=", data_fim
              )
            }

            h <- curl::new_handle()
            curl::handle_setheaders(
              h,
              "accept" = "application/json",
              "x-api-key" = apikey,
              "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Accept-Language" = "pt-BR,pt;q=0.9,en-US;q=0.8,en;q=0.7"
            )
            curl::handle_setopt(h, connecttimeout = 45, timeout = 60, followlocation = TRUE, ssl_verifypeer = FALSE)

            resposta <- tryCatch(
              curl::curl_fetch_memory(url = final_url, handle = h),
              error = function(e) {
                message("Erro na requisição: ", e$message)
                list(status_code = 999, content = charToRaw(e$message))
              }
            )

            if (resposta$status_code == 999 && !nzchar(scraper_key) && tentativa <= 3) {
              message("Proxy falhou. Buscando novo proxy...")
              new_proxy <- find_working_proxy(apikey)
              if (!is.null(new_proxy)) {
                message("Novo proxy selecionado: ", new_proxy)
                Sys.setenv(http_proxy = paste0("http://", new_proxy))
                Sys.setenv(https_proxy = paste0("http://", new_proxy))
                return(pega_dados_brutos(estacao, indicador, data_inicio, data_fim, tentativa + 1))
              } else {
                message("Nenhum novo proxy. Tentando direto...")
                Sys.unsetenv("http_proxy")
                Sys.unsetenv("https_proxy")
                return(pega_dados_brutos(estacao, indicador, data_inicio, data_fim, tentativa + 1))
              }
            }

            if (resposta$status_code %in% c(403, 429, 500) && tentativa <= 3) {
              message("Erro ", resposta$status_code, " para ", estacao, ". Tentativa ", tentativa, " de 3. Aguardando 10s...")
              Sys.sleep(10)
              return(pega_dados_brutos(estacao, indicador, data_inicio, data_fim, tentativa + 1))
            }

            # Retorna o conteúdo bruto (JSON como texto)
            conteudo <- rawToChar(resposta$content)
            list(
              estacao = estacao,
              status = resposta$status_code,
              json = conteudo
            )
          }

          # --- Execução: busca dados brutos e salva como JSON ---
          estacoes_lista <- estacoes$cod_estacao
          todos_jsons <- list()
          for (i in seq_along(estacoes_lista)) {
            est <- estacoes_lista[i]
            message("Processando ", i, "/", length(estacoes_lista), ": ", est)
            resultado <- pega_dados_brutos(est, "I101", Sys.Date() - 15, Sys.Date() - 1)
            todos_jsons[[est]] <- resultado
            if (i < length(estacoes_lista)) Sys.sleep(1)
          }

          # Salva todos os JSONs brutos em um único arquivo (formato lista)
          json_final <- jsonlite::toJSON(todos_jsons, auto_unbox = TRUE, pretty = TRUE)
          writeLines(json_final, "dados_brutos.json")

          # Opcional: também tenta extrair um CSV simplificado com as primeiras colunas (se existirem)
          # Para não quebrar, vamos tentar parsear cada JSON e extrair os dados de forma genérica
          # Se falhar, apenas avisa.
          base_temp <- tryCatch({
            df_list <- list()
            for (est in names(todos_jsons)) {
              item <- todos_jsons[[est]]
              if (item$status == 200) {
                parsed <- jsonlite::fromJSON(item$json, simplifyDataFrame = TRUE)
                dados <- parsed$data$data
                if (!is.null(dados) && nrow(dados) > 0) {
                  # Pega as duas primeiras colunas (timestamp e valor) independente do nome
                  cols <- colnames(dados)
                  if (length(cols) >= 2) {
                    df <- data.frame(
                      estacao = est,
                      timestamp = dados[[cols[1]]],
                      valor = dados[[cols[2]]],
                      stringsAsFactors = FALSE
                    )
                    df_list[[est]] <- df
                  } else {
                    message("Estação ", est, " retornou dados com menos de 2 colunas. Ignorando.")
                  }
                }
              }
            }
            dplyr::bind_rows(df_list)
          }, error = function(e) {
            message("Erro ao gerar CSV simplificado: ", e$message)
            NULL
          })

          if (!is.null(base_temp) && nrow(base_temp) > 0) {
            vroom::vroom_write(base_temp, file = "base_temp.csv", delim = ";")
          } else {
            # Se não conseguiu extrair, salva um arquivo vazio com aviso
            writeLines("Nenhum dado válido foi extraído.", "base_temp.csv")
          }

          message("Arquivo dados_brutos.json salvo com sucesso.")
          EOF

          Rscript script.R

      - name: Configurar usuário git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit e push
        if: success()
        run: |
          git add dados_brutos.json base_temp.csv
          if git diff --staged --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "Atualização automática dos dados brutos [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
          fi
