# .github/workflows/atualizar_dados.yml
name: Atualizar dados meteorológicos

on:
  # Agendamento diário (ajuste o horário conforme necessário)
  schedule:
    - cron: '0 10 * * *'   # Executa todos os dias às 10:00 UTC
  # Permite disparo manual pela interface do GitHub
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: false  # Será redefinido para commit

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'  # ou a versão que desejar
          use-public-rspm: true

      - name: Instalar dependências do sistema (se necessário)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Instalar pacotes R
        run: |
          # Instala pacman primeiro para carregar os demais
          Rscript -e "install.packages('pacman', repos = 'https://cloud.r-project.org')"
          Rscript -e "pacman::p_load(httr, tidyverse, jsonlite, vroom, usethis, logger, curl, rlang, purrr, dplyr, tidyr, readr, tibble)"
          # Se houver outros pacotes, adicione aqui

      - name: Executar script R
        env:
          # A API key está hardcoded no script, mas é recomendável usar secrets
          # BNDMET_API_KEY: ${{ secrets.BNDMET_API_KEY }}
          # Caso queira parametrizar, modifique o script para ler de variável de ambiente
          TZ: America/Sao_Paulo
        run: |
          Rscript pacmanp_load(httr, tidyverse, jsonlite, vroom,.txt  # ou o nome real do arquivo
          # Se o arquivo tiver outro nome, ajuste o comando acima, ex: Rscript script.R

      - name: Configurar usuário git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit e push das alterações
        if: success()
        run: |
          git add base_temp.csv
          # Verifica se houve mudanças antes de commitar
          if git diff --staged --quiet; then
            echo "Nenhuma alteração no arquivo CSV."
          else
            git commit -m "Atualização automática dos dados meteorológicos [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
          fi
