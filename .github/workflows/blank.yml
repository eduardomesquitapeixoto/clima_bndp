          ARRAIAL D,ARRAIAL DO CABO,RJ,Operante,-22.97527777,-42.02138888,5,21/09/2006,A606,805404.484,7456116.417,auto
          CAMBUCI_0,CAMBUCI,RJ,Pane,-21.58749999,-41.95833333,46,19/11/2002,A604,814971.906,7609751.871,auto
          CAMPOS DOS GOYTACAZES,CAMPOS DOS GOYTACAZES,RJ,Operante,-21.71472222,-41.34388889,17,24/09/2006,A607,878324.749,7594278.583,auto
          CAMPOS DOS GOYTACAZES - SAO TOME,CAMPOS DOS GOYTACAZES - SAO TOME,RJ,Operante,-22.04166666,-41.05166666,7,12/06/2008,A620,907664.500,7557284.032,auto
          CARMO,CARMO,RJ,Operante,-21.9386111,-42.60083333,293,10/10/2018,A629,747803.012,7572028.758,auto
          DUQUE DE ,DUQUE DE CAXIAS - XEREM,RJ,Pane,-22.58972221,-43.28222221,22,20/10/2002,A603,676586.805,7500879.655,auto
          XEREM_01-,DUQUE DE CAXIAS - XEREM,RJ,Pane,-22.58972221,-43.28222221,22,20/10/2002,A603,676586.805,7500879.655,auto
          MACAE_01-,MACAE,RJ,Operante,-22.3761111,-41.81194444,28,21/09/2006,A608,828320.129,7522062.140,auto
          NITEROI,NITEROI,RJ,Operante,-22.86749999,-43.10194444,6,12/07/2018,A627,694730.002,7469894.103,auto
          NOVA FRIB,NOVA FRIBURGO - SALINAS,RJ,Operante,-22.33472221,-42.67694443,1070,17/09/2010,A624,739267.908,7528279.242,auto
          PARATY,PARATY,RJ,Operante,-23.2236111,-44.72694443,3,18/11/2006,A619,527936.918,7431699.952,auto
